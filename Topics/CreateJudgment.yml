info:
  name: CreateJudgment
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseURL}}/api/topics/1/judgments"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "verdict": "positive",
        "comment": "事前に連絡しているなら問題ないと思う",
        "isAnonymous": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
