info:
  name: CreateTopic
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/api/topics"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "会議に5分遅刻した",
        "description": "電車の遅延が理由",
        "positiveLabel": "OK",
        "negativeLabel": "NG",
        "deadlineAt": "2026-12-31T18:00:00+09:00"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
