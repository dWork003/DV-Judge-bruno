info:
  name: ListTopics
  type: http
  seq: 0

http:
  method: GET
  url: "{{baseURL}}/api/topics?keyword=&page=1"
  params:
    - name: keyword
      value: ""
      type: query
    - name: page
      value: "1"
      type: query
  headers:
    - name: Accept
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
